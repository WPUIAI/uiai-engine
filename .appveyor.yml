# AppVeyor free OSS tier for UIAI Engine Windows builds (Spec 177 addendum).
version: "{build}"
skip_branch_with_pr: true
image: Visual Studio 2022
clone_folder: c:\gopath\src\github.com\WPUIAI\uiai-engine
environment:
  GOPATH: c:\gopath
  GO111MODULE: on
install:
  - choco upgrade golang -y --no-progress || exit 0
  - refreshenv
  - set PATH=%GOPATH%\bin;c:\Program Files\Go\bin;%PATH%
  - go version
build_script:
  - cd c:\gopath\src\github.com\WPUIAI\uiai-engine && go build ./...
test_script:
  - go vet ./internal/...
  - go test ./internal/...
deploy: off
