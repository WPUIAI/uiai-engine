# AppVeyor free OSS tier for UIAI Engine Windows builds (Spec 177 addendum).
version: "{build}"
image: Visual Studio 2022
clone_folder: c:\gopath\src\github.com\WPUIAI\uiai-engine
environment:
  GOPATH: c:\gopath
  GO111MODULE: on
  GOTOOLCHAIN: auto
install:
  - set PATH=%GOPATH%\bin;c:\Program Files\Go\bin;%PATH%
  - go version
  - go env GOTOOLDIR GOROOT GOTOOLCHAIN
build_script:
  - cd c:\gopath\src\github.com\WPUIAI\uiai-engine && go build ./...
test_script:
  - go vet ./internal/...
  - go test ./internal/...
deploy: off
