# AppVeyor free OSS tier for UIAI Engine Windows builds (Spec 177 addendum).
version: "{build}"
# Keep the PR integration receipt; do not also rebuild its branch.
skip_branch_with_pr: true
image: Visual Studio 2022
clone_folder: c:\gopath\src\github.com\WPUIAI\uiai-engine
environment:
  GOPATH: c:\gopath
  GO111MODULE: on
  GOTOOLCHAIN: local
  GOROOT: c:\uiai-go\go
  GO_SHA256: 7ecd2d7260e82c59bcbd7f1077a07cee2dea607295b858df67195a1e4e09629b
  PATH: c:\uiai-go\go\bin;c:\gopath\bin;%PATH%
install:
  - ps: |
      $goMod = Get-Content -Raw (Join-Path $env:APPVEYOR_BUILD_FOLDER 'go.mod')
      $match = [regex]::Match($goMod, '(?m)^go\s+(\d+\.\d+\.\d+)\s*$')
      if (-not $match.Success) { throw "Go toolchain version missing from go.mod" }
      $version = $match.Groups[1].Value
      $archive = Join-Path $env:TEMP "go$version.windows-amd64.zip"
      Invoke-WebRequest "https://go.dev/dl/go$version.windows-amd64.zip" -OutFile $archive
      $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
      if ($actual -ne $env:GO_SHA256) { throw "Go toolchain checksum mismatch: $actual" }
      if (Test-Path "c:\uiai-go") { Remove-Item -Recurse -Force "c:\uiai-go" }
      New-Item -ItemType Directory -Force "c:\uiai-go" | Out-Null
      Expand-Archive -Path $archive -DestinationPath "c:\uiai-go"
  - go version
  - go env GOTOOLDIR GOROOT GOTOOLCHAIN
build_script:
  - cd c:\gopath\src\github.com\WPUIAI\uiai-engine && go build ./...
test_script:
  - go vet ./internal/...
  - go test ./internal/...
deploy: off
