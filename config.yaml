# UIAI Engine Configuration
server:
  port: 7456
  host: "127.0.0.1"
  disable_vision: false
  vision_pool_size: 2
  read_timeout: 60s
  write_timeout: 360s  # captcha proxy solves need 3-5 min

wordpress:
  url: "https://wpuiai.com"
  rest_namespace: "wpuiai-ai-cloud/v1"
  webhook_secret: "${WEBHOOK_SECRET}"
  cache_ttl: 0  # 5 minutes

ai:
  # default_model and default_provider are read from WP admin settings
  # at runtime via /wp-json/wpuiai-ai-cloud/v1/ai-settings.
  # Do NOT set them here.
  providers:
    anthropic:
      api_url: "https://api.anthropic.com/v1/messages"
      api_version: "2023-06-01"
    openai:
      api_url: "https://api.openai.com/v1"
    openrouter:
      api_url: "https://openrouter.ai/api/v1"
      site_url: "https://wpuiai.com"
      site_name: "WPUIAI AI Cloud"
    fireworks:
      api_url: "https://api.fireworks.ai/inference/v1"
    kimi:
      api_url: "https://api.kimi.com/coding/v1/messages"
    minimax:
      api_url: "https://api.minimax.io/v1"

vision:
  pool_size: 2
  max_pool: 2
  idle_timeout: 300s
  screenshot_quality: 65
  share_dir: "/home/wpuiai/ai-api/shares"
  allow_private_urls: false

# Shared browser profile system used by the Go-core profile launcher and Cockpit.
browser:
  default_profile: "detect"
  profiles:
    detect:
      label: "Detect / Diagnostic"
      mode: "detect"
      engine: "system_chromium"
      headless: true
      launch:
        no_sandbox: true
        disable_gpu: true
        disable_extensions: true
        disable_web_security: false
        ignore_cert_errors: false
        block_trackers: false
      identity:
        locale: "en-US"
        languages: ["en-US", "en"]
        viewport:
          width: 1280
          height: 800
          device_scale_factor: 1
      network:
        route: "direct"
      storage:
        cookie_mode: "ephemeral"
        cache_mode: "ephemeral"
        local_storage_mode: "ephemeral"
      challenge:
        policy: "detect"
        max_attempts: 1
        operator_escalation: true
      behavior:
        timing_profile: "deterministic"
        pointer_profile: "direct"
        scrolling_profile: "direct"
        navigation_profile: "deterministic"
      observability:
        diagnostics_level: "developer"
        fingerprint_capture: true
        challenge_capture: true
        network_capture: true

    no_detect:
      extends: "detect"
      label: "No Detect"
      mode: "no_detect"
      identity:
        patch_webdriver: true
        patch_chrome_object: true
        patch_plugins: true
        patch_languages: true
        disable_automation_controlled: true
        # Retain the runtime browser UA unless a coherent UA catalog is configured.
        random_user_agent: false
      network:
        route: "local_ip_pool"
        route_ref: "captcha-default"
        dns_mode: "proxy"
        webrtc_mode: "proxy_only"
        geo_consistency: true
        sticky: true
      storage:
        isolation_key: "no-detect-default"
        cookie_mode: "profile"
        cache_mode: "profile"
        local_storage_mode: "profile"
      challenge:
        policy: "solve_and_retry"
        max_attempts: 3
        route_rotation: true
        operator_escalation: true
        text_solver: "auto"
        image_grid_solver: "auto"
        audio_solver: "whisper"
      behavior:
        timing_profile: "humanized"
        pointer_profile: "humanized"
        scrolling_profile: "humanized"
        navigation_profile: "humanized"

    operator:
      extends: "detect"
      label: "Operator"
      mode: "operator"
      headless: false
      launch:
        persistent_context: true
        user_data_dir: "${UIAI_OPERATOR_PROFILE_DIR}"
      network:
        route: "operator_route"
        route_ref: "operator-default"
        geo_consistency: true
        sticky: true
      storage:
        isolation_key: "operator-default"
        cookie_mode: "persistent"
        cache_mode: "persistent"
        local_storage_mode: "persistent"
        credential_profile_ref: "operator-default"
        exclusive_lock: true
      challenge:
        policy: "assist"
        max_attempts: 1
        operator_escalation: true
      observability:
        diagnostics_level: "standard"
        challenge_capture: true

    research:
      extends: "no_detect"
      label: "Research / Eval"
      mode: "research"
      storage:
        isolation_key: "research-ephemeral"
        cookie_mode: "ephemeral"
        cache_mode: "ephemeral"
        local_storage_mode: "ephemeral"
      observability:
        diagnostics_level: "full"
        fingerprint_capture: true
        challenge_capture: true
        network_capture: true
        evidence_grade: true

  domain_rules: []
  # Example:
  # - pattern: "*.example.com"
  #   profile: "no_detect"
  #   challenge_policy: "solve_and_retry"
  #   priority: 100

media:
  script_dir: "/home/wpuiai/public_html/wp-content/plugins/wpuiai/assets/templates/devices"
  job_timeout: 300

credits:
  costs:
    screenshot: 0.5
    critique: 2.0
    ui_reverse: 3.0
    copilot: 1.0
    coach_visual: 0.5
    workflow_step: 1.0
    style_enhance: 2.0
    layout_compare: 2.0
    section_detect: 1.0
    device_mockup: 2.0
    animated_gif: 3.0
    product_video: 5.0

rate_limits:
  tiers:
    free:       { per_hour: 10,   per_day: 100 }
    starter:    { per_hour: 100,  per_day: 1000 }
    pro:        { per_hour: 500,  per_day: 5000 }
    agency:     { per_hour: 2000, per_day: 20000 }
    enterprise: { per_hour: 5000, per_day: 50000 }

captcha:
  enabled: true
  default_provider: "openrouter"
  default_model: "google/gemini-2.0-flash-001"
  text:
    max_attempts: 5
    retry_delay: "1s"
    prompt_template: "blind_assistant"
    fallback_chain: ["vlm", "tesseract"]
  recaptcha:
    strategy: "full_grid"
    max_rounds: 3
    max_attempts: 2
    action_delay_min_ms: 200
    action_delay_max_ms: 800
    verify_delay_min_ms: 500
    verify_delay_max_ms: 1000
    audio_fallback: true
    whisper_url: "http://localhost:8115"
  proxy:
    enabled: true
    strategy: "weighted"           # "weighted" | "least_conn" | "round_robin" | "random"
    max_concurrent_per_ip: 2       # max simultaneous solves per IP
    cooldown_minutes: 60           # auto-cooldown flagged IPs
    max_retries: 2                 # auto-retry on different IP before returning failure
    health_file: "/var/log/uiai/ip-pool-health.json"
    health_probe_url: "https://www.google.com/recaptcha/api.js"  # periodic reachability check
    health_probe_seconds: 300      # probe every 5 min
    local_ips:
      - "199.167.201.52"           # unused, clean
      - "199.167.202.209"          # unused, clean
      - "199.167.203.234"          # unused, clean
      # Main IP 199.167.200.52 is FLAGGED — do NOT add
      # 67.222.9.109 is thedream/SendyKit — avoid
      # Add more at $1/IP/mo as needed
    # External proxies (if local IPs get flagged):
    # proxies:
    #   - "socks5://user:pass@host:port"
  stealth:
    patch_webdriver: true
    random_user_agent: true
  stats:
    enabled: true
    log_file: "/var/log/uiai/captcha-stats.jsonl"

storage:
  data_dir: "/home/wpuiai/uiai-engine/data"
  usage_file: "usage.json"

# Project-scoped Evidence PWA registry. Provider observations remain
# focusa_binding_pending until exact Focusa/artifact revisions reconcile.
evidence_registry:
  provider_sync_enabled: false
  focusa_url: "http://127.0.0.1:8787"
  br_path: "/usr/local/bin/br"
  project_ids: []
  allowed_root_prefixes: []
  max_projects: 100
  max_items: 100000
  reconcile_interval: 5s

logging:
  level: "info"
  file: "/var/log/uiai/engine.log"

cors:
  origins:
    - "https://wpuiai.com"
    - "https://ai.wpuiai.com"
  methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  headers: ["Content-Type", "X-API-Key", "X-License-Key", "X-Webhook-Secret", "X-Extension-Token", "Authorization"]
