schema: uiai.cockpit_credential_grant_secret_proxy_use_receipt.v1
version: 1
parent: UIAI-COCKPIT-008
status: proposed_documentation_only
implementation_implied: false

constitutional_law:
  focusa: authorizes_credential_use_without_receiving_secret
  uiai_engine: stores_and_injects_secret_without_self_authorizing
  raw_secret_in_focusa: forbidden
  raw_secret_in_agent_context: forbidden
  raw_secret_in_logs_artifacts_screenshots_or_receipts: forbidden

focusa_credential_use_grant:
  schema_id: focusa.credential_use_grant.v1
  owner: focusa
  required_fields:
    - grant_id
    - grant_revision
    - exact_scope
    - requesting_actor_ref
    - capability_ref
    - purpose
    - allowed_origins
    - allowed_operation_classes
    - side_effect_ceiling
    - issued_at
    - expires_at
    - approval_ref
    - revocation_state
    - receipt_required
  optional_controls:
    - spend_ceiling
    - use_limit
    - allowed_data_classes
    - allowed_routes_pattern
    - allowed_methods
    - allowed_ui_surfaces
    - delegation_policy
  contains_secret_material: false

uiai_secret_binding:
  schema_id: uiai.secret_binding.v1
  owner: uiai_engine
  required_fields:
    - secret_binding_id
    - opaque_credential_ref
    - vault_provider
    - target_origins
    - injection_mode
    - active_lease_ref
    - rotation_state
    - revocation_state
  optional_controls:
    - allowed_routes
    - allowed_methods
    - account_label
    - connector_ref
    - use_count
    - last_used_at
    - max_concurrent_uses
    - network_route_constraint
    - browser_profile_constraint
  injection_modes:
    - header_proxy
    - connector
    - browser_fill
    - environment_proxy
    - signed_request_proxy
  contains_focusa_authority: false

credential_use_lease:
  schema_id: uiai.credential_use_lease.v1
  required:
    - lease_id
    - lease_generation
    - focusa_grant_ref
    - secret_binding_ref
    - work_surface_binding_ref
    - target_origin
    - operation_class
    - issued_at
    - expires_at
    - fencing_token
  states:
    - requested
    - authorized
    - active
    - consumed
    - expired
    - revoked
    - origin_mismatch
    - scope_mismatch
    - operation_mismatch
    - blocked

admission_checks:
  - focusa_grant_exists_and_is_current
  - exact_project_workstream_attachment_and_work_surface_match
  - requesting_actor_matches
  - target_origin_matches
  - route_and_method_match_when_restricted
  - operation_class_matches
  - side_effect_and_spend_ceiling_allow_action
  - use_limit_not_exhausted
  - secret_binding_is_healthy_and_not_revoked
  - browser_profile_and_network_route_match_when_restricted
  - lease_generation_and_fencing_are_current
  - data_egress_class_is_allowed

secret_proxy:
  agent_receives:
    - opaque_credential_ref
    - availability_status
    - allowed_origin_summary
    - expiry_summary
    - recovery_action
  agent_never_receives:
    - raw_token
    - password
    - cookie
    - authorization_header
    - private_key
    - refresh_token
    - secret_environment_value
  injection_boundary:
    - immediately_before_approved_operation
    - minimum_necessary_target
    - no_prompt_or_transcript_round_trip
    - clear_or_release_after_use

use_receipt:
  schema_id: uiai.credential_use_receipt.v1
  required:
    - receipt_id
    - focusa_grant_ref
    - secret_binding_ref
    - credential_use_lease_ref
    - work_surface_binding_ref
    - target_origin
    - operation_class
    - started_at
    - completed_at
    - result_status
    - side_effect_class
    - revocation_posture
    - redaction_verified
  optional:
    - route_template
    - http_method
    - external_confirmation_ref
    - cost_or_spend
    - retry_count
    - evidence_refs
    - reconciliation_ref
  forbidden:
    - secret_value
    - full_authorization_header
    - cookie_value
    - private_request_body_when_sensitive

ui:
  mission_canvas_projection:
    visible:
      - credential_available
      - approval_required
      - expires_at
      - revoked
      - origin_mismatch
      - use_or_spend_boundary
      - affected_work_surface
    hidden:
      - raw_secret
      - vault_location_detail
      - rotation_material
  cockpit_components:
    - CredentialGrantStatus
    - SecretBindingInspector
    - CredentialUsePreview
    - CredentialUseReceiptView
  setup_and_rotation_location: cockpit_settings_or_service_detail
  consequential_use_preview:
    - purpose
    - project_and_work_surface
    - account_label
    - target_origin
    - operation_class
    - side_effects
    - spend_ceiling
    - expiry
    - receipt_posture

standing_grants:
  allowed: true
  required_bounds:
    - exact_origin_or_connector
    - exact_project_or_approved_project_set
    - operation_class
    - side_effect_ceiling
    - spend_ceiling_when_applicable
    - expiry
    - use_limit_or_review_interval
    - revocation
  forbidden:
    - universal_always_allow
    - raw_secret_delegation
    - implicit_cross_project_reuse

failure_states:
  - no_focusa_grant
  - grant_expired
  - grant_revoked
  - secret_binding_missing
  - secret_binding_revoked
  - origin_mismatch
  - route_or_method_mismatch
  - operation_class_mismatch
  - side_effect_ceiling_exceeded
  - spend_ceiling_exceeded
  - use_limit_exhausted
  - actor_or_scope_mismatch
  - browser_profile_mismatch
  - network_route_mismatch
  - egress_policy_blocked
  - lease_fencing_conflict
  - injection_failed
  - result_ambiguous
  - receipt_or_redaction_failed

security_tests:
  - prompt_injection_requests_secret
  - page_attempts_cross_origin_secret_use
  - agent_attempts_unapproved_route
  - stale_grant_replay
  - revoked_binding_reuse
  - screenshot_and_log_secret_scan
  - redirect_to_unapproved_origin
  - browser_context_switch_after_approval
  - cross_project_binding_reuse
  - retry_after_ambiguous_side_effect
  - standing_grant_boundary_escape

requirements:
  - id: CRED-001
    statement: Focusa grants contain authority metadata but no secret material.
  - id: CRED-002
    statement: UIAI SecretBindings contain custody metadata but no Focusa authority.
  - id: CRED-003
    statement: Every use requires matching grant, binding, lease, origin, scope, and operation.
  - id: CRED-004
    statement: Agents receive opaque refs rather than raw secrets.
  - id: CRED-005
    statement: Standing grants remain bounded by origin, project, operation, side effect, spend, and expiry.
  - id: CRED-006
    statement: Consequential uses produce secret-safe receipts.
  - id: CRED-007
    statement: Redirects and context changes trigger revalidation.
  - id: CRED-008
    statement: Revocation and expiry block use immediately subject to active-operation reconciliation.
  - id: CRED-009
    statement: Raw secret scanning is release-blocking for logs, captures, and artifacts.
  - id: CRED-010
    statement: Ambiguous side effects reconcile before retry.

closure:
  status: implementation_open
  requires:
    - focusa_grant_operations
    - secure_vault_or_keychain
    - opaque_secret_proxy
    - origin_and_operation_admission
    - lease_and_fencing
    - secret_safe_receipts
    - redaction_and_leak_tests
    - functional_and_visual_proof
