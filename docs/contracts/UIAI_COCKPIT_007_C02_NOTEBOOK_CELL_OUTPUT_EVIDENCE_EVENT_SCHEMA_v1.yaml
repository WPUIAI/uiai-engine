  run:
    - notebook.run.exploratory_started
    - notebook.run.reproducible_previewed
    - notebook.run.reproducible_started
    - notebook.run.reproducible_completed
    - notebook.run.reproducible_failed
    - notebook.run.verification_started
    - notebook.run.verification_completed
    - notebook.run.verification_failed
  verification:
