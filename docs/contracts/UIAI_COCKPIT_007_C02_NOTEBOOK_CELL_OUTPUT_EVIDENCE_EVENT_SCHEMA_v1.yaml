schema: uiai.cockpit_notebook_event_schema.v1
version: 1
parent: UIAI-COCKPIT-007
status: proposed_documentation_only
implementation_implied: false

canonical_envelope:
  schema: uiai.notebook_event.v1
  required:
    - event_id
    - sequence
    - timestamp
    - timestamp_precision
    - event_type
    - schema_version
    - source_state_revision
    - correlation_id
    - payload
  properties:
    event_id: stable_unique_string
    sequence: monotonically_increasing_integer_within_stream_scope
    cursor: opaque_or_numeric_replay_cursor
    timestamp: rfc3339_utc_preserving_source_fractional_precision
    timestamp_precision:
      enum: [second, millisecond, microsecond, nanosecond, provider_declared, unknown]
    timestamp_uncertainty_ns: nonnegative_integer_or_null
    clock_source: string_or_null
    clock_sync_posture:
      enum: [synchronized, bounded_uncertainty, local_unsynchronized, provider_reported, unknown]
    event_type: namespaced_string
    schema_version: string
    source_state_revision: integer_or_string
    scope_ref: object_or_null
    principal_ref: object_or_null
    server_ref: string_or_null
    notebook_id: string_or_null
    notebook_revision_id: string_or_null
    session_ref: string_or_null
    kernel_ref: string_or_null
    cell_id: string_or_null
    cell_revision_id: string_or_null
    attempt_id: string_or_null
    correlation_id: string
    causation_id: string_or_null
    parent_event_ids: array
    payload_ref: string_or_null
    artifact_refs: array
    invalidate: array
    redaction_posture:
      enum: [none_required, redacted, public_safe, restricted, secret_adjacent]
    payload: object

stream_invariants:
  - sequence never decreases within the declared stream scope
  - duplicate event_id is idempotent and does not repeat visible state transitions
  - replay and live-tail overlap is deduplicated by event_id and source_state_revision
  - transport keepalive is not emitted as notebook work activity
  - malformed events move the projection to degraded or stale rather than being silently ignored
  - event payloads do not contain credentials, raw secrets, cookies, authorization headers, or kernel connection files
  - artifact-sized output is referenced rather than embedded without bound
  - source timestamp precision is retained even when the UI displays an abbreviated value

notebook_event_types:
  server:
    - notebook.server.discovered
    - notebook.server.probe_started
    - notebook.server.connected
    - notebook.server.degraded
    - notebook.server.unauthorized
    - notebook.server.disconnected
    - notebook.server.capabilities_changed
  document:
    - notebook.document.opened
    - notebook.document.revision_loaded
    - notebook.document.edit_proposed
    - notebook.document.saved
    - notebook.document.save_conflict
    - notebook.document.renamed
    - notebook.document.deleted
    - notebook.document.checkpoint_created
    - notebook.document.checkpoint_restored
    - notebook.document.external_change_detected
  session:
    - notebook.session.created
    - notebook.session.reconnected
    - notebook.session.owner_changed
    - notebook.session.closed
    - notebook.session.lease_expired
  kernel:
    - notebook.kernel.start_requested
    - notebook.kernel.started
    - notebook.kernel.idle
    - notebook.kernel.busy
    - notebook.kernel.interrupt_requested
    - notebook.kernel.interrupted
    - notebook.kernel.restart_requested
    - notebook.kernel.restarted
    - notebook.kernel.shutdown_requested
    - notebook.kernel.shutdown
    - notebook.kernel.lost
    - notebook.kernel.recovered
    - notebook.kernel.resource_pressure
  cell:
    - notebook.cell.revision_created
    - notebook.cell.ready
    - notebook.cell.queued
    - notebook.cell.dispatched
    - notebook.cell.started
    - notebook.cell.awaiting_input
    - notebook.cell.input_supplied
    - notebook.cell.streaming
    - notebook.cell.succeeded
    - notebook.cell.failed
    - notebook.cell.interrupt_requested
    - notebook.cell.interrupted
    - notebook.cell.timeout_requested
    - notebook.cell.timed_out
    - notebook.cell.cancel_requested
    - notebook.cell.cancelled
    - notebook.cell.unknown_terminal_state
    - notebook.cell.superseded
  output:
    - notebook.output.stream_appended
    - notebook.output.display_created
    - notebook.output.display_updated
    - notebook.output.result_created
    - notebook.output.error_created
    - notebook.output.artifact_captured
    - notebook.output.sanitized
    - notebook.output.unsupported_renderer
    - notebook.output.stale
    - notebook.output.redacted
  environment:
