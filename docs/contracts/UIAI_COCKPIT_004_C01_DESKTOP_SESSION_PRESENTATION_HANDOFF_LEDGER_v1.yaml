requirements:
  - id: DSP-001
    title: One browser authority
    owner: uiai-engine
    acceptance: Engine remains sole process, context, page, cookie, storage, diagnostics, and lifecycle authority.
  - id: DSP-002
    title: Cockpit desktop shell
    owner: uaiengine-cockpit
    acceptance: Full desktop browser presentation opens in or focuses Cockpit.
  - id: DSP-003
    title: Same-session presentation
    owner: uiai-engine+uaiengine-cockpit
    acceptance: Presentation preserves canonical session ID and page-state lineage.
  - id: DSP-004
    title: No surprise runtime download
    owner: uiai-release
    acceptance: Production first use performs zero browser downloads.
  - id: DSP-005
    title: Packaged signed runtime
    owner: uiai-release
    acceptance: Runtime manifest, checksum, platform, architecture, signature, and CDP probe pass.
  - id: DSP-006
    title: Explicit development fallback
    owner: uiai-engine
    acceptance: Rod-managed download requires explicit development opt-in.
  - id: DSP-007
    title: No installed-browser default
    owner: uiai-engine
    acceptance: Production never silently uses Chrome, Brave, Edge, or a user profile.
  - id: DSP-008
    title: Typed Cockpit handoff
    owner: uiai-engine
    acceptance: Presentation request/status/ack are versioned, bounded, and idempotent.
  - id: DSP-009
    title: Single Cockpit instance
    owner: uaiengine-cockpit
    acceptance: Cold and warm activation converge on one process and selected session.
  - id: DSP-010
    title: Bidirectional scheme ownership
    owner: uaiengine-cockpit+focusa-menubar
    acceptance: focusa:// routes to Menubar and cockpit:// routes to Cockpit without collision.
  - id: DSP-011
    title: Opaque secret-free deep links
    owner: uaiengine-cockpit+focusa-menubar
    acceptance: Deep-link fixtures contain opaque refs only and pass secret/path/URL scans.
  - id: DSP-012
    title: Truth-plane fallback
    owner: uiai-engine+focusa-daemon
    acceptance: Stale or unresolved refs remain non-mutating and recover through authenticated reads.
  - id: DSP-013
    title: Distinct app identities
    owner: uaiengine-cockpit+focusa-menubar
    acceptance: Bundle IDs, device IDs, Keychain services, and tokens stay separate.
  - id: DSP-014
    title: Reuse FPV transport
    owner: uiai-engine+uaiengine-cockpit
    acceptance: Cockpit uses CDP screencast, MJPEG/poll fallback, audited controls, and diagnostics.
  - id: DSP-015
    title: Scoped mutations
    owner: uiai-engine+focusa-daemon
    acceptance: Scope, consent, owner, lease, and audit guards apply to all presentation controls.
  - id: DSP-016
    title: Standalone resilience
    owner: all
    acceptance: Engine, Cockpit, and Menubar each degrade truthfully when siblings are absent.
  - id: DSP-017
    title: Typed recovery
    owner: all
    acceptance: Runtime, app, protocol, session, stream, scope, and lease failures have distinct recovery.
  - id: DSP-018
    title: Version negotiation
    owner: all
    acceptance: Engine, runtime, Cockpit, Menubar, FPV, and handoff versions are observable and gated.

routes:
  engine:
    - method: POST
      path: /api/session/{session_id}/present
      mutation: true
      schema: uiai.desktop_presentation_request.v1
      output: uiai.desktop_presentation_receipt.v1
    - method: GET
      path: /api/presentation/{presentation_id}
      mutation: false
      output: uiai.desktop_presentation_status.v1
    - method: POST
      path: /api/presentation/{presentation_id}/ack
      mutation: true
      output: uiai.desktop_presentation_receipt.v1
    - method: GET
      path: /.well-known/uiai-desktop.json
      mutation: false
      output: focusa.app.manifest.v2
  deep_links:
    - focusa://mission/{opaque_ref}
    - focusa://card/{opaque_ref}
    - focusa://workpoint/{opaque_ref}
    - focusa://connect?payload={governed_pairing_payload}
    - cockpit://live/session/{opaque_session_id}?handoff={opaque_ref}
    - cockpit://focusa/{opaque_ref}
    - cockpit://evidence/{opaque_ref}
    - cockpit://settings/pairing

