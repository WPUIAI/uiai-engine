name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (go vet/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  cockpit:
    name: Cockpit (Node 22 + Tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: apps/cockpit
        run: npm ci
      - working-directory: apps/cockpit
        run: npm run check
      - working-directory: apps/cockpit
        run: npm run build
      - working-directory: apps/cockpit
        run: npm run tauri build -- --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: "untrusted comment: minisign secret key\nRWQ3ZeYjL66+DvRXLe+KcVrTGv7PiK9AgvuxA/Jh7XIvgXvp3PSGusouRZHQugeTaMtw4K00SWneL0ivuj9TRO6/"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - run: |
          APP=$(find apps/cockpit/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP" && /usr/bin/plutil -lint "$APP/Contents/Info.plist" && echo "plutil PASS $APP"
      - working-directory: apps/cockpit
        run: npm run test || true
      - working-directory: apps/cockpit
        run: npm run cockpit:smoke -- --mode local-only --mock-external || true
