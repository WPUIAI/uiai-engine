name: Assemble numbered Cockpit master

on:
  push:
    branches: [main]
    paths:
      - .github/cockpit-upload/manifest.txt

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify master specification
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cockpit-upload/text-part-* > docs/UIAI_COCKPIT_000_UNIFIED_PRODUCT_IA_UX_SPEC_2026-07-16_v0.5.md
          echo "ac30b930f921feb6d8ebfa4314fb7c010cd6240b6931e88e2584e003af673869  docs/UIAI_COCKPIT_000_UNIFIED_PRODUCT_IA_UX_SPEC_2026-07-16_v0.5.md" | sha256sum --check --strict

      - name: Commit master and remove one-time assembly inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UIAI_COCKPIT_000_UNIFIED_PRODUCT_IA_UX_SPEC_2026-07-16_v0.5.md
          git rm -r .github/cockpit-upload
          git rm .github/workflows/assemble-cockpit-master.yml
          git commit -m "docs: add numbered UIAI Cockpit master specification"
          git push origin HEAD:main
