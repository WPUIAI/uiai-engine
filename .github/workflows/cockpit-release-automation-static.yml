name: Cockpit Release Automation (static)

# Sibling of Focusa release-automation-static in ci.yml.
# Static proof that cockpit release scripts exist, are executable, and the
# audit ledger is wired correctly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cockpit-release-automation-static:
    name: Cockpit Release Automation (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Auto-heal cockpit audit trail
        run: python3 apps/cockpit/scripts/auto-heal-cockpit-audit.py --kind static_self_heal --reason "release-automation-static PR"

      - name: Static proof — scripts exist
        run: |
          set -euo pipefail
          for f in \
            apps/cockpit/scripts/stamp-cockpit-version/version.ts \
            apps/cockpit/scripts/create-cockpit-dev-release-tag.sh \
            apps/cockpit/scripts/cockpit-release.sh \
            apps/cockpit/scripts/auto-heal-cockpit-audit.py \
            apps/cockpit/scripts/cockpit-doctor.sh; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            [ -x "$f" ] || chmod +x "$f"
            echo "ok $f"
          done

      - name: Static proof — workflows exist
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/cockpit.yml \
            .github/workflows/cockpit-release.yml \
            .github/workflows/cockpit-dev-release-tag.yml \
            .github/workflows/cockpit-audit-recorder.yml \
            .github/workflows/deploy-cockpit.yml \
            .github/workflows/cockpit-auto-retry-deploy.yml; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" || { echo "invalid YAML: $f"; exit 1; }
            echo "ok $f"
          done

      - name: Static proof — release-metadata.json schema (fixture)
        run: |
          python3 -c "
          import json, pathlib
          schema_keys = {'schema','app','version','channel','tag','signed','notarized','artifacts'}
          sample = {
            'schema': 'focusa.cockpit.release.v1',
            'app': 'focusa-cockpit',
            'version': '0.1.0',
            'channel': 'stable',
            'tag': 'cockpit-v0.1.0',
            'signed': True,
            'notarized': True,
            'artifacts': [],
          }
          assert schema_keys.issubset(sample.keys()), set(sample.keys()) ^ schema_keys
          print('schema ok')
          "
