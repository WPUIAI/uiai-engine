name: Audit Recorder (self-heal trigger)

on:
  workflow_run:
    workflows: ["Cockpit CI", "Cockpit Release", "Deploy Cockpit"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Hourly drift check; auto-heal will keep the trail synchronized even
    # if a workflow did not run.
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-recorder
  cancel-in-progress: false

jobs:
  record-and-heal:
    name: Record failure + self-heal
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record CI failure (self-triggered) + Self-heal
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          LOG_URL: ${{ github.event.workflow_run.html_url }}
          TS: ${{ github.event.workflow_run.updated_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Append the failure row, then run the real self-heal: pull logs,
          # match against known anti-patterns, apply a targeted fix on a
          # new branch, push, and re-dispatch the failed workflow.
          mkdir -p release-proof/cockpit
          cat >> release-proof/cockpit/audit.jsonl <<EOF
          {"schema":"uaiengine.cockpit.audit.v1","kind":"cockpit_ci_failure","workflow":"${WORKFLOW}","run_id":"${RUN_ID}","head_sha":"${HEAD_SHA}","branch":"${BRANCH}","at":"${TS}","log_url":"${LOG_URL}"}
          EOF
          python3 apps/cockpit/scripts/auto-heal-cockpit-audit.py "${RUN_ID}" "failure" "${WORKFLOW}"

      - name: Validate audit JSONL shape
        run: |
          python3 -c 'import json,sys\nfor line in open("release-proof/cockpit/audit.jsonl"):\n  line=line.strip()\n  if not line: continue\n  d=json.loads(line)\n  assert d.get("schema")=="uaiengine.cockpit.audit.v1", d\nprint("[audit-recorder] schema OK")'

      - name: Commit audit updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release-proof/cockpit/audit.jsonl; then
            echo "[audit-recorder] no audit changes"
            exit 0
          fi
          git config user.name 'uaiengine-cockpit-bot'
          git config user.email 'uaiengine-cockpit-bot@users.noreply.github.com'
          git add release-proof/cockpit/audit.jsonl
          git commit -m "audit(cockpit): self-heal append from ${{ github.event_name }} @ ${{ github.run_id }}"
          git push