name: Cockpit CI

# Mirrors the menubar job shape from Focusa .github/workflows/ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cockpit:
    name: Cockpit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/cockpit
        run: npm ci
      - name: Ensure rollup darwin-arm64 native binary
        if: runner.os == 'macOS'
        working-directory: apps/cockpit
        run: |
          npm install --no-save --no-package-lock \
            @rollup/rollup-darwin-arm64@4.62.2
      - name: Typecheck
        working-directory: apps/cockpit
        run: npm run check
      - name: Web build
        working-directory: apps/cockpit
        run: npm run build
      - name: Functional UI visual proof
        working-directory: apps/cockpit
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          npm exec --yes playwright@1.54.2 install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uiai-cockpit-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npm exec --yes playwright@1.54.2 screenshot \
            --viewport-size="1440,1200" \
            --wait-for-timeout=400 \
            "http://127.0.0.1:4173/" \
            visual-proof/cockpit-focusa-idle.png
          npm exec --yes playwright@1.54.2 screenshot \
            --viewport-size="1440,1200" \
            --wait-for-timeout=1900 \
            "http://127.0.0.1:4173/?evidence=focusa-live" \
            visual-proof/cockpit-focusa-live-after-events.png
          test -s visual-proof/cockpit-focusa-idle.png
          test -s visual-proof/cockpit-focusa-live-after-events.png
          IDLE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-idle.png | awk '{print $1}')
          LIVE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-live-after-events.png | awk '{print $1}')
          cat > visual-proof/manifest.json <<JSON
          {
            "schema": "uiai.cockpit_visual_proof.v1",
            "commit_sha": "${GITHUB_SHA}",
            "viewport": "1440x1200",
            "captures": [
              {
                "file": "cockpit-focusa-idle.png",
                "state": "idle_no_synthetic_activity",
                "sha256": "${IDLE_SHA}"
              },
              {
                "file": "cockpit-focusa-live-after-events.png",
                "state": "durable_event_replay_applied",
                "expected_cursor": "103",
                "expected_source_revision": "43",
                "sha256": "${LIVE_SHA}"
              }
            ]
          }
          JSON
      - name: Upload functional UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-functional-ui-evidence-${{ github.sha }}
          path: apps/cockpit/visual-proof
          if-no-files-found: error
          retention-days: 30
      - name: Generate icons (if missing)
        working-directory: apps/cockpit
        run: ./scripts/generate-icons.sh
      - name: Tauri package proof
        working-directory: apps/cockpit
        run: npm run tauri build -- --bundles app
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/cockpit/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
      - name: Vitest
        working-directory: apps/cockpit
        run: npm run test
      - name: Backend smoke (mock external)
        working-directory: apps/cockpit
        run: npm run cockpit:smoke -- --mode local-only --mock-external
