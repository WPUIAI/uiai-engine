name: Cockpit CI

# Mirrors the menubar job shape from Focusa .github/workflows/ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cockpit:
    name: Cockpit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/cockpit
        run: npm ci
      - name: Ensure rollup darwin-arm64 native binary
        if: runner.os == 'macOS'
        working-directory: apps/cockpit
        run: |
          # npm's optional-dependency resolution drops platform binaries
          # that match the runner's host but not the runner's architecture
          # in some npm versions. Install the binary explicitly so vite's
          # rollup native call does not fail with the known npm cli #4828.
          npm install --no-save --no-package-lock \
            @rollup/rollup-darwin-arm64@4.62.2
      - name: Typecheck
        working-directory: apps/cockpit
        run: npm run check
      - name: Web build
        working-directory: apps/cockpit
        run: npm run build
      - name: Tauri build (no bundle, icon-independent)
        working-directory: apps/cockpit
        # Use --no-bundle so the build does not require icons/* which are
        # added by the release/tag pipeline. This proves the tauri compile
        # graph is green without forcing icon assets into the CI image.
        run: npm run tauri build -- --no-bundle
      - name: Validate macOS binary
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BIN=apps/cockpit/src-tauri/target/release/uaiengine-cockpit
          test -x "$BIN" || { echo "missing binary"; exit 1; }
          echo "Built binary: $($BIN --version 2>&1 | head -1)"
      - name: Vitest (optional)
        working-directory: apps/cockpit
        run: npm run test || true
      - name: Backend smoke (mock external)
        working-directory: apps/cockpit
        run: npm run cockpit:smoke -- --mode local-only --mock-external || true
