name: Cockpit CI

# Mirrors the menubar job shape from Focusa .github/workflows/ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cockpit:
    name: Cockpit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: apps/cockpit
        run: npm ci
      - name: Ensure rollup darwin-arm64 native binary
        if: runner.os == 'macOS'
        working-directory: apps/cockpit
        run: |
          npm install --no-save --no-package-lock \
            @rollup/rollup-darwin-arm64@4.62.2
      - name: Typecheck
        working-directory: apps/cockpit
        run: npm run check
      - name: Web build
        working-directory: apps/cockpit
        run: npm run build
      - name: Functional UI visual proof
        working-directory: apps/cockpit
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          npm exec --yes playwright@1.54.2 install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uiai-cockpit-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          BROWSER=$(find "$HOME/Library/Caches/ms-playwright" -type f \
            \( -name "Chromium" -o -name "Google Chrome for Testing" -o -name "chrome-headless-shell" \) \
            2>/dev/null | grep -E '/Contents/MacOS/|chrome-headless-shell$' | head -1)
          test -n "$BROWSER"

          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=1500 \
            --dump-dom "http://127.0.0.1:4173/" > visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-live-state="idle"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-cursor="0"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-activity-count="0"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-evidence-ready="false"' visual-proof/cockpit-focusa-idle.dom.html

          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=1500 \
            --dump-dom "http://127.0.0.1:4173/?evidence=focusa-live" > visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-live-state="live"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-cursor="103"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-source-revision="43"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-activity-count="3"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-evidence-ready="true"' visual-proof/cockpit-focusa-live.dom.html
          grep -q '2.5–4.0 hours' visual-proof/cockpit-focusa-live.dom.html
          grep -q '12 authority events' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'Profile A partial verified' visual-proof/cockpit-focusa-live.dom.html
          grep -q '>active<' visual-proof/cockpit-focusa-live.dom.html

          npm exec --yes playwright@1.54.2 screenshot \
            --viewport-size="1440,1200" \
            --wait-for-timeout=400 \
            "http://127.0.0.1:4173/" \
            visual-proof/cockpit-focusa-idle.png
          npm exec --yes playwright@1.54.2 screenshot \
            --viewport-size="1440,1200" \
            --wait-for-timeout=400 \
            "http://127.0.0.1:4173/?evidence=focusa-live" \
            visual-proof/cockpit-focusa-live-after-events.png

          test -s visual-proof/cockpit-focusa-idle.png
          test -s visual-proof/cockpit-focusa-live-after-events.png
          IDLE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-idle.png | awk '{print $1}')
          LIVE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-live-after-events.png | awk '{print $1}')
          IDLE_DOM_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-idle.dom.html | awk '{print $1}')
          LIVE_DOM_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-live.dom.html | awk '{print $1}')
          test "$IDLE_SHA" != "$LIVE_SHA"
          IDLE_SIZE=$(sips -g pixelWidth -g pixelHeight visual-proof/cockpit-focusa-idle.png | awk '/pixelWidth/{w=$2}/pixelHeight/{h=$2}END{print w"x"h}')
          LIVE_SIZE=$(sips -g pixelWidth -g pixelHeight visual-proof/cockpit-focusa-live-after-events.png | awk '/pixelWidth/{w=$2}/pixelHeight/{h=$2}END{print w"x"h}')
          test "$IDLE_SIZE" = "1440x1200"
          test "$LIVE_SIZE" = "1440x1200"

          cat > visual-proof/manifest.json <<JSON
          {
            "schema": "uiai.cockpit_visual_proof.v1",
            "commit_sha": "${GITHUB_SHA}",
            "viewport": "1440x1200",
            "production_reducer_asserted": true,
            "captures": [
              {
                "file": "cockpit-focusa-idle.png",
                "dom_file": "cockpit-focusa-idle.dom.html",
                "state": "idle_no_synthetic_activity",
                "sha256": "${IDLE_SHA}",
                "dom_sha256": "${IDLE_DOM_SHA}",
                "asserted_live_state": "idle",
                "asserted_activity_count": 0
              },
              {
                "file": "cockpit-focusa-live-after-events.png",
                "dom_file": "cockpit-focusa-live.dom.html",
                "state": "durable_event_replay_applied",
                "expected_cursor": "103",
                "expected_source_revision": "43",
                "expected_activity_count": 3,
                "sha256": "${LIVE_SHA}",
                "dom_sha256": "${LIVE_DOM_SHA}"
              }
            ]
          }
          JSON
      - name: Upload functional UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-functional-ui-evidence-${{ github.sha }}
          path: apps/cockpit/visual-proof
          if-no-files-found: error
          retention-days: 30
      - name: Generate icons (if missing)
        working-directory: apps/cockpit
        run: ./scripts/generate-icons.sh
      - name: Tauri package proof
        working-directory: apps/cockpit
        run: npm run tauri build -- --bundles app
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/cockpit/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
      - name: Vitest
        working-directory: apps/cockpit
        run: npm run test
      - name: Backend smoke (mock external)
        working-directory: apps/cockpit
        run: npm run cockpit:smoke -- --mode local-only --mock-external
