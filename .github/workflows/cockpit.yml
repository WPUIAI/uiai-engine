name: Cockpit CI

# Mirrors the menubar job shape from Focusa .github/workflows/ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_ota:
        description: Run private native OTA qualification (no publication)
        type: boolean
        default: false
      candidate_version:
        description: Intended candidate app version
        type: string
        default: '0.3.1'
      baseline_version:
        description: Declared old-version native canary (not a historical-binary claim)
        type: string
        default: '0.3.0'
      baseline_ref:
        description: Immutable previously verified UIAI source for the baseline canary
        type: string
        default: 'c9b94a1dd77c052b4b6df9e07573d1237cad652f'

jobs:
  cockpit:
    name: Cockpit
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualify_ota }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Native macOS RSS sampling proof
        run: go test ./internal/vision -run 'Test(DarwinNativeRSS|PSProcessTreeRSS|RSSPressureSnapshot|TreeRSSKBSelfPositive|ShouldRecycleByPressureThreshold)' -count=1 -timeout=45s
      - name: Native macOS Bash 3.2 compatibility proof
        env:
          UIAI_TEST_BASH: /bin/bash
        run: |
          /bin/bash --version
          python3 -m unittest discover -s tests -p test_cli_optional_auth.py -v
          python3 -m unittest discover -s tests -p test_go_format_gate.py -v
      - name: Install dependencies
        working-directory: apps/cockpit
        run: npm ci
      - name: Ensure rollup darwin-arm64 native binary
        if: runner.os == 'macOS'
        working-directory: apps/cockpit
        run: |
          npm install --no-save --no-package-lock \
            @rollup/rollup-darwin-arm64@4.62.2
      - name: Critical and high dependency audit
        working-directory: apps/cockpit
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: apps/cockpit
        run: npm run check
      - name: Web build
        working-directory: apps/cockpit
        run: npm run build
      - name: Functional UI visual proof
        working-directory: apps/cockpit
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          npm exec --yes playwright@1.54.2 install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uiai-cockpit-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          BROWSER=$(find "$HOME/Library/Caches/ms-playwright" -type f \
            \( -name "Chromium" -o -name "Google Chrome for Testing" -o -name "chrome-headless-shell" \) \
            2>/dev/null | grep -E '/Contents/MacOS/|chrome-headless-shell$' | head -1)
          test -n "$BROWSER"
          echo "Visual proof browser: $BROWSER"

          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=1500 \
            --dump-dom "http://127.0.0.1:4173/" > visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-live-state="idle"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-cursor="0"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-activity-count="0"' visual-proof/cockpit-focusa-idle.dom.html
          grep -q 'data-evidence-ready="false"' visual-proof/cockpit-focusa-idle.dom.html

          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=1500 \
            --dump-dom "http://127.0.0.1:4173/?evidence=focusa-live" > visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-live-state="live"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-cursor="103"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-source-revision="43"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-activity-count="3"' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'data-evidence-ready="true"' visual-proof/cockpit-focusa-live.dom.html
          grep -q '2.5–4.0 hours' visual-proof/cockpit-focusa-live.dom.html
          grep -q '12 authority events' visual-proof/cockpit-focusa-live.dom.html
          grep -q 'Profile A partial verified' visual-proof/cockpit-focusa-live.dom.html
          grep -q '>active<' visual-proof/cockpit-focusa-live.dom.html
          echo "Rendered-state assertions passed"

          IDLE_PATH="$(pwd)/visual-proof/cockpit-focusa-idle.png"
          LIVE_PATH="$(pwd)/visual-proof/cockpit-focusa-live-after-events.png"
          "$BROWSER" --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1440,1200 --virtual-time-budget=1500 \
            --screenshot="$IDLE_PATH" "http://127.0.0.1:4173/"
          "$BROWSER" --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1440,1200 --virtual-time-budget=1500 \
            --screenshot="$LIVE_PATH" "http://127.0.0.1:4173/?evidence=focusa-live"

          test -s visual-proof/cockpit-focusa-idle.png
          test -s visual-proof/cockpit-focusa-live-after-events.png
          IDLE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-idle.png | awk '{print $1}')
          LIVE_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-live-after-events.png | awk '{print $1}')
          IDLE_DOM_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-idle.dom.html | awk '{print $1}')
          LIVE_DOM_SHA=$(shasum -a 256 visual-proof/cockpit-focusa-live.dom.html | awk '{print $1}')
          IDLE_SIZE=$(sips -g pixelWidth -g pixelHeight visual-proof/cockpit-focusa-idle.png | awk '/pixelWidth/{w=$2}/pixelHeight/{h=$2}END{print w"x"h}')
          LIVE_SIZE=$(sips -g pixelWidth -g pixelHeight visual-proof/cockpit-focusa-live-after-events.png | awk '/pixelWidth/{w=$2}/pixelHeight/{h=$2}END{print w"x"h}')
          echo "Idle screenshot: sha256=$IDLE_SHA size=$IDLE_SIZE"
          echo "Live screenshot: sha256=$LIVE_SHA size=$LIVE_SIZE"
          echo "Idle DOM: sha256=$IDLE_DOM_SHA"
          echo "Live DOM: sha256=$LIVE_DOM_SHA"
          if [[ "$IDLE_SHA" == "$LIVE_SHA" ]]; then
            echo "Visual proof failure: idle and live screenshots are identical" >&2
            exit 1
          fi
          if [[ "$IDLE_SIZE" != "1440x1200" || "$LIVE_SIZE" != "1440x1200" ]]; then
            echo "Visual proof failure: expected 1440x1200 captures" >&2
            exit 1
          fi

          cat > visual-proof/manifest.json <<JSON
          {
            "schema": "uiai.cockpit_visual_proof.v1",
            "commit_sha": "${GITHUB_SHA}",
            "viewport": "1440x1200",
            "production_reducer_asserted": true,
            "captures": [
              {
                "file": "cockpit-focusa-idle.png",
                "dom_file": "cockpit-focusa-idle.dom.html",
                "state": "idle_no_synthetic_activity",
                "sha256": "${IDLE_SHA}",
                "dom_sha256": "${IDLE_DOM_SHA}",
                "asserted_live_state": "idle",
                "asserted_activity_count": 0
              },
              {
                "file": "cockpit-focusa-live-after-events.png",
                "dom_file": "cockpit-focusa-live.dom.html",
                "state": "durable_event_replay_applied",
                "expected_cursor": "103",
                "expected_source_revision": "43",
                "expected_activity_count": 3,
                "sha256": "${LIVE_SHA}",
                "dom_sha256": "${LIVE_DOM_SHA}"
              }
            ]
          }
          JSON
      - name: Upload functional UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-functional-ui-evidence-${{ github.sha }}
          path: apps/cockpit/visual-proof
          if-no-files-found: error
          retention-days: 30
      - name: Generate icons (if missing)
        working-directory: apps/cockpit
        run: ./scripts/generate-icons.sh
      - name: Disable updater artifact creation for unsigned CI package proof
        run: |
          jq '.bundle.createUpdaterArtifacts = false' apps/cockpit/src-tauri/tauri.conf.json > /tmp/tauri.ci.json && mv /tmp/tauri.ci.json apps/cockpit/src-tauri/tauri.conf.json
          jq -e '.plugins.updater.pubkey | startswith("dW50cnVzdGVk")' apps/cockpit/src-tauri/tauri.conf.json >/dev/null
          echo "tauri.conf patched for unsigned package proof; public verification key retained"
      - name: Tauri package proof
        working-directory: apps/cockpit
        run: npm run tauri build -- --bundles app
      - name: Validate macOS bundle
        run: |
          set -euo pipefail
          APP_PATH=$(find apps/cockpit/src-tauri/target/release/bundle/macos -name "*.app" | head -1)
          test -n "$APP_PATH"
          echo "Found bundle: $APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/bin/plutil -lint "$APP_PATH/Contents/Info.plist"
      - name: Vitest
        working-directory: apps/cockpit
        run: npm run test
      - name: Backend smoke (mock external)
        working-directory: apps/cockpit
        run: npm run cockpit:smoke -- --mode local-only --mock-external

  native-ota-qualification:
    name: Native OTA qualification (${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_ota }}
    permissions:
      contents: read
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            arch: x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      BASELINE_VERSION: ${{ inputs.baseline_version }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CANDIDATE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-native-ota-${{ matrix.target }}
      - name: Build actual signed candidate with production configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/cockpit-latest
          COCKPIT_RELEASE_FAST_PATH: '1'
          UPDATER_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          for name in ('CANDIDATE_VERSION','BASELINE_VERSION'):
              assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ[name]), 'Expected a bounded stable version'
          assert tuple(map(int,os.environ['CANDIDATE_VERSION'].split('.'))) > tuple(map(int,os.environ['BASELINE_VERSION'].split('.'))), 'Candidate must be newer'
          PY
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Existing approved updater signing reference is unavailable' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ota-candidate"
          cp apps/cockpit/scripts/qualify-native-ota.py "$RUNNER_TEMP/qualify-native-ota.py"
          mkdir -p "$RUNNER_TEMP/ota-build-adapter"
          cp scripts/stamp-uiai-version.py "$RUNNER_TEMP/ota-build-adapter/stamp.py"
          cp apps/cockpit/scripts/cockpit-release.sh "$RUNNER_TEMP/ota-build-adapter/release.sh"
          cp apps/cockpit/scripts/stamp-cockpit-version/stamp-cockpit-version "$RUNNER_TEMP/ota-build-adapter/stamp-adapter.sh"
          jq -r '.plugins.updater.pubkey' apps/cockpit/src-tauri/tauri.conf.json > "$RUNNER_TEMP/ota-candidate/public-key.txt"
          jq -r '.identifier' apps/cockpit/src-tauri/tauri.conf.json > "$RUNNER_TEMP/ota-candidate/identifier.txt"
          ./apps/cockpit/scripts/generate-icons.sh
          TAG="cockpit-v${CANDIDATE_VERSION}" ./apps/cockpit/scripts/cockpit-release.sh
          cp "apps/cockpit/release-proof/cockpit/updater/uaiengine-cockpit_${CANDIDATE_VERSION}_${UPDATER_ARCH}.app.tar.gz" "$RUNNER_TEMP/ota-candidate/candidate.app.tar.gz"
          cp "apps/cockpit/release-proof/cockpit/updater/uaiengine-cockpit_${CANDIDATE_VERSION}_${UPDATER_ARCH}.app.tar.gz.sig" "$RUNNER_TEMP/ota-candidate/candidate.app.tar.gz.sig"
      # One worktree, sequential checkouts; no duplicate UIAI checkout is created.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline_ref }}
          clean: false
      - name: Build declared baseline canary with private feed and unchanged trust key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COCKPIT_RELEASE_FAST_PATH: '1'
        run: |
          set -euo pipefail
          echo "BASELINE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # Current canonical build adapters, prior app source; no duplicate source tree.
          cp "$RUNNER_TEMP/ota-build-adapter/stamp.py" scripts/stamp-uiai-version.py
          cp "$RUNNER_TEMP/ota-build-adapter/release.sh" apps/cockpit/scripts/cockpit-release.sh
          cp "$RUNNER_TEMP/ota-build-adapter/stamp-adapter.sh" apps/cockpit/scripts/stamp-cockpit-version/stamp-cockpit-version
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('apps/cockpit/src-tauri/tauri.conf.json');d=json.loads(p.read_text())
          expected=(pathlib.Path(os.environ['RUNNER_TEMP'])/'ota-candidate/public-key.txt').read_text().strip()
          assert d['plugins']['updater']['pubkey']==expected, 'Existing updater trust key changed'
          d['plugins']['updater']['endpoints']=['http://127.0.0.1:48763/latest.json']
          d['plugins']['updater']['dangerousInsecureTransportProtocol']=True
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          TAG="cockpit-v${BASELINE_VERSION}" ./apps/cockpit/scripts/cockpit-release.sh
          mkdir -p "$RUNNER_TEMP/native-ota/install"
          app="$(find "apps/cockpit/src-tauri/target/${TARGET_TRIPLE}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d)"
          test -n "$app"
          ditto "$app" "$RUNNER_TEMP/native-ota/install/UIAI Engine Cockpit.app"
      - name: Real native invalid-signature, upgrade, relaunch and preservation checks
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Signing credentials are deliberately NOT in the consumer process environment.
          test -z "${TAURI_SIGNING_PRIVATE_KEY:-}"
          python3 "$RUNNER_TEMP/qualify-native-ota.py" \
            --app "$RUNNER_TEMP/native-ota/install/UIAI Engine Cockpit.app" \
            --candidate "$RUNNER_TEMP/ota-candidate/candidate.app.tar.gz" \
            --signature "$RUNNER_TEMP/ota-candidate/candidate.app.tar.gz.sig" \
            --baseline-version "$BASELINE_VERSION" --candidate-version "$CANDIDATE_VERSION" \
            --platform "$NATIVE_PLATFORM" \
            --identifier "$(cat "$RUNNER_TEMP/ota-candidate/identifier.txt")" \
            --output "$RUNNER_TEMP/native-ota-proof/receipt.json"
      - name: Preserve native evidence and actual candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-native-ota-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-ota-proof
            ${{ runner.temp }}/ota-candidate
          if-no-files-found: error
          retention-days: 7
