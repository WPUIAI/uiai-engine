name: UIAI Engine Release + OVH Deploy

on:
  push:
    tags:
      - 'engine-v*'
      - 'uiai-engine-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable engine release tag, e.g. engine-v2.0.24
        required: true
        type: string
      deploy_to_ovh:
        description: Deploy release artifact to OVH worker after release
        required: false
        default: true
        type: boolean
      dry_run:
        description: Preflight only; do not upload/install on OVH
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  ENGINE_ASSET_NAME: uiai-engine-linux-amd64
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: engine-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  open-issue-release-gate:
    name: Open release-gate issue check
    if: ${{ startsWith(inputs.release_tag || github.ref_name, 'engine-v') || startsWith(inputs.release_tag || github.ref_name, 'uiai-engine-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-gating issue closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == *"-dev"* ]]; then echo "dev tag — gate advisory"; exit 0; fi
          open="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/issues?state=open&per_page=100" | jq -s '[.[][] | select(has("pull_request") | not) | select(any(.labels[]?; .name | startswith("release-gate:"))) | {number, title, labels: [.labels[].name]}]')"
          if [ "$(jq 'length' <<<"$open")" -ne 0 ]; then echo "::error::Release blocked by open release-gate issues: $open"; exit 1; fi
          echo "open_issue_release_gate=passed"

  pull-request-release-gate:
    name: Pull request inclusion gate
    if: ${{ startsWith(inputs.release_tag || github.ref_name, 'engine-v') || startsWith(inputs.release_tag || github.ref_name, 'uiai-engine-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require tag inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          blocking_prs=$(gh pr list --repo "$REPOSITORY" --state open --limit 500 --json number,title,url,labels | jq '[.[] | select(any(.labels[]?; (.name | startswith("release-gate:")) or .name == "release-candidate")) | {number,title,url,labels:[.labels[].name]}]')
          if [ "$(jq 'length' <<<"$blocking_prs")" -ne 0 ]; then echo "::error::Release blocked by release-scoped pull requests: $blocking_prs"; exit 1; fi
          previous=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          since=$(if [ -n "$previous" ]; then git log -1 --format=%cI "$previous"; else echo '1970-01-01T00:00:00Z'; fi)
          gh pr list --repo "$REPOSITORY" --state merged --limit 500 --search "merged:>=${since%%T*}" --json number,mergeCommit,mergedAt,baseRefName | jq -r --arg since "$since" '.[] | select(.baseRefName == "main" and .mergedAt > $since) | [.number,.mergeCommit.oid] | @tsv' | while IFS=$'\t' read -r number commit; do [ -n "$commit" ] || { echo "::error::PR #$number has no merge commit"; exit 1; }; git merge-base --is-ancestor "$commit" "$TAG" || { echo "::error::PR #$number merge $commit is absent from tag $TAG"; exit 1; }; done
          echo "pull_request_release_gate=passed"

  tag-ci-proof:
    name: Exact tag CI proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Wait for successful CI on stamped candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 120); do runs=$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$CANDIDATE_SHA" -f per_page=10 --jq '[.workflow_runs[] | {status,conclusion,url:.html_url,headSha:.head_sha}]'); run=$(jq -c --arg sha "$CANDIDATE_SHA" 'map(select(.headSha == $sha)) | .[0] // {}' <<<"$runs"); status=$(jq -r '.status // "missing"' <<<"$run"); conclusion=$(jq -r '.conclusion // ""' <<<"$run"); if [ "$status" = completed ] && [ "$conclusion" = success ]; then echo "tag_ci_proof=${run}"; exit 0; fi; if [ "$status" = completed ] && [ "$conclusion" != success ]; then echo "::error::Stamped candidate CI failed: ${run}"; exit 1; fi; if (( attempt % 6 == 0 )); then echo "tag_ci_wait attempt=${attempt} status=${status} receipt=${run}"; fi; sleep 10; done; echo "::error::Timed out waiting for stamped candidate CI ${CANDIDATE_SHA}"; exit 1

  version-policy:
    name: Release version policy
    if: ${{ startsWith(inputs.release_tag || github.ref_name, 'engine-v') || startsWith(inputs.release_tag || github.ref_name, 'uiai-engine-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag against canonical version surfaces
        run: |
          set -euo pipefail
          python3 scripts/verify-uiai-version-surfaces.py "$RELEASE_TAG"

  build-release:
    name: Build parent UIAI Engine release
    needs: [open-issue-release-gate, pull-request-release-gate, version-policy, tag-ci-proof]
    runs-on: [self-hosted, ovh, uiai-engine]
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      asset_name: ${{ env.ENGINE_ASSET_NAME }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          case "$tag" in
            engine-v*|uiai-engine-v*) ;;
            *) echo "release tag must start with engine-v or uiai-engine-v: $tag" >&2; exit 2 ;;
          esac
          version="${tag#engine-v}"
          version="${version#uiai-engine-v}"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Test parent engine
        run: go test ./...

      - name: Build linux/amd64 engine binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }} -X main.buildTime=${{ steps.meta.outputs.build_time }}" \
            -o "dist/${ENGINE_ASSET_NAME}" \
            ./cmd/uiai-engine
          chmod +x "dist/${ENGINE_ASSET_NAME}"
          "dist/${ENGINE_ASSET_NAME}" -version

      - name: Hash release artifact
        id: hash
        shell: bash
        run: |
          sha256sum "dist/${ENGINE_ASSET_NAME}" | tee "dist/${ENGINE_ASSET_NAME}.sha256"
          echo "sha256=$(awk '{print $1}' dist/${ENGINE_ASSET_NAME}.sha256)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (deterministic, script-owned)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          notes="dist/release-notes.md"
          # DETERMINISTIC — script-owned, never agent. Detailed: type/area/files/features.
          python3 scripts/generate-release-notes.py --tag "$RELEASE_TAG" --output "$notes"
          # Append artifact provenance (supplements script output)
          {
            echo ""
            echo "---"
            echo "### Artifact provenance"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`${ENGINE_ASSET_NAME}\`"
            echo "- SHA256: \`${{ steps.hash.outputs.sha256 }}\`"
            echo "- Deploy target: OVH worker (via deploy job; public domains unchanged)"
          } >> "$notes"
          echo "release_notes_generated $(wc -l < "$notes") lines for $RELEASE_TAG"

      - name: Stage draft candidate (never publish before verification)
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="dist/release-notes.md"
          # A failed metadata read must not masquerade as a missing release.
          state="$(gh release list --limit 1000 --json tagName,isDraft | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tagName == $tag) | .isDraft')"
          case "$state" in
            true)
              gh release upload "$RELEASE_TAG" "dist/${ENGINE_ASSET_NAME}" "dist/${ENGINE_ASSET_NAME}.sha256" --clobber
              gh release edit "$RELEASE_TAG" --notes-file "$notes"
              ;;
            false) echo 'Published releases are immutable; refusing replacement' >&2; exit 2 ;;
            '')
              gh release create "$RELEASE_TAG" "dist/${ENGINE_ASSET_NAME}" "dist/${ENGINE_ASSET_NAME}.sha256" \
                --verify-tag --draft --title "UIAI Engine ${RELEASE_TAG}" --notes-file "$notes"
              ;;
            *) echo 'Ambiguous release metadata; refusing mutation' >&2; exit 2 ;;
          esac

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uiai-engine-release-${{ steps.meta.outputs.release_tag }}
          path: |
            dist/${{ env.ENGINE_ASSET_NAME }}
            dist/${{ env.ENGINE_ASSET_NAME }}.sha256

  deploy-ovh:
    name: Deploy parent UIAI Engine to OVH worker
    needs: build-release
    runs-on: [self-hosted, ovh, uiai-engine]
    if: ${{ github.event_name == 'push' || inputs.deploy_to_ovh }}
    environment: production
    concurrency:
      group: uiai-engine-ovh-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: uiai-engine-release-${{ needs.build-release.outputs.release_tag }}
          path: dist

      - name: Configure SSH key
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          OVH_UIAI_SSH_KEY: ${{ secrets.OVH_UIAI_SSH_KEY }}
          OVH_UIAI_SSH_HOST: ${{ secrets.OVH_UIAI_SSH_HOST }}
          OVH_UIAI_SSH_USER: ${{ secrets.OVH_UIAI_SSH_USER }}
          OVH_UIAI_SSH_PORT: ${{ secrets.OVH_UIAI_SSH_PORT }}
        shell: bash
        run: |
          test -n "$OVH_UIAI_SSH_KEY" || { echo "OVH_UIAI_SSH_KEY secret is required" >&2; exit 2; }
          test -n "$OVH_UIAI_SSH_HOST" || { echo "OVH_UIAI_SSH_HOST secret is required" >&2; exit 2; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_UIAI_SSH_KEY" > ~/.ssh/id_uiai_ovh
          chmod 600 ~/.ssh/id_uiai_ovh
          cat > ~/.ssh/config <<CFG
          Host uiai-ovh
            HostName ${OVH_UIAI_SSH_HOST}
            User ${OVH_UIAI_SSH_USER:-root}
            Port ${OVH_UIAI_SSH_PORT:-22}
            IdentityFile ~/.ssh/id_uiai_ovh
            StrictHostKeyChecking accept-new
            BatchMode yes
          CFG

      - name: Deploy to OVH worker
        env:
          ASSET_PATH: dist/uiai-engine-linux-amd64
          REMOTE_HOST: uiai-ovh
          REMOTE_USER: ${{ secrets.OVH_UIAI_SSH_USER }}
          REMOTE_PORT: ${{ secrets.OVH_UIAI_SSH_PORT }}
          RELEASE_TAG: ${{ needs.build-release.outputs.release_tag }}
          REMOTE_INSTALL_ROOT: ${{ vars.OVH_UIAI_INSTALL_ROOT }}
          REMOTE_SERVICE_NAME: ${{ vars.OVH_UIAI_SERVICE_NAME }}
          REMOTE_HEALTH_URL: ${{ vars.OVH_UIAI_HEALTH_URL }}
          REMOTE_EXTRA_SERVICES: ${{ vars.OVH_UIAI_EXTRA_SERVICES }}
          REMOTE_SMOKE_BASE_URLS: ${{ vars.OVH_UIAI_SMOKE_BASE_URLS }}
          REMOTE_UIAI_EPWA_PUBLIC_BASE_URL: ${{ vars.UIAI_EPWA_PUBLIC_BASE_URL }}
          REMOTE_EVIDENCE_SCOPE_JSON: ${{ secrets.REMOTE_EVIDENCE_SCOPE_JSON }}
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
          RUN_BROWSER_SMOKE: "1"
        shell: bash
        run: |
          export REMOTE_INSTALL_ROOT="${REMOTE_INSTALL_ROOT:-/home/wpuiai/uiai-engine}"
          export REMOTE_SERVICE_NAME="${REMOTE_SERVICE_NAME:-uiai-engine-ovh.service}"
          export REMOTE_HEALTH_URL="${REMOTE_HEALTH_URL:-http://127.0.0.1:7456/health}"
          export REMOTE_EXTRA_SERVICES="${REMOTE_EXTRA_SERVICES:-uiai-engine-ovh-w2.service}"
          export REMOTE_SMOKE_BASE_URLS="${REMOTE_SMOKE_BASE_URLS:-http://127.0.0.1:7460}"
          if [[ "${WORKFLOW_DRY_RUN:-false}" == "true" ]]; then export DRY_RUN=1; else export DRY_RUN=0; fi
          scripts/deploy-engine-ovh.sh

  publish-release:
    name: Publish only the verified deployed candidate
    needs: [build-release, deploy-ovh]
    if: ${{ needs.deploy-ovh.result == 'success' && (github.event_name == 'push' || (inputs.deploy_to_ovh && !inputs.dry_run)) }}
    runs-on: [self-hosted, ovh, uiai-engine]
    environment: production
    steps:
      - name: Verify draft bytes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.release_tag }}
          EXPECTED_SHA256: ${{ needs.build-release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          [[ "$state" == true ]] || { echo 'Only an unmodified draft may be promoted' >&2; exit 2; }
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'Missing tested artifact digest' >&2; exit 2; }
          candidate="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --pattern "$ENGINE_ASSET_NAME" --dir "$candidate"
          actual="$(sha256sum "$candidate/$ENGINE_ASSET_NAME" | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo 'Draft differs from tested deployed artifact' >&2; exit 2; }
          case "$RELEASE_TAG" in
            *-dev*) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
          esac
