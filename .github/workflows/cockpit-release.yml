name: Cockpit Release

on:
  push:
    tags:
      - 'cockpit-v*'

permissions:
  contents: write

jobs:
  rust-check:
    name: Rust + frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo checks
        working-directory: apps/cockpit/src-tauri
        run: |
          cargo test
          cargo clippy -- -D warnings

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Frontend checks
        working-directory: apps/cockpit
        run: |
          npm ci
          npm run check
          npm run build

  create-release:
    name: Create GitHub Release
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges | head -40)
          else
            COMMITS=$(git log --oneline --no-merges | head -40)
          fi
          mkdir -p /tmp/release-artifacts
          cat > /tmp/release-notes.md <<EOF
          ## UIAI Engine Cockpit ${TAG}

          Cross-platform UIAI Engine Cockpit binary release.

          ### Assets
          - Linux x86_64 binary (no-bundle)
          - macOS x86_64 binary (no-bundle)
          - Checksums for each asset

          ### Commits since previous tag
          ```
          ${COMMITS}
          ```
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UIAI Engine Cockpit ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

  build-upload:
    name: Build and upload (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: Linux_x86_64
          - platform: macos-latest
            artifact_name: macOS_x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v6
        if: matrix.platform == 'ubuntu-latest'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json

      - uses: actions/setup-node@v6
        if: matrix.platform == 'macos-latest'
        with:
          node-version: '22'

      - name: Build no-bundle tauri binary
        working-directory: apps/cockpit
        env:
          TAG: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail

          # Workaround npm bug with optional dependencies (rollup native for darwin-arm64/x64).
          # See https://github.com/npm/cli/issues/4828 — clean node_modules + reinstall.
          rm -rf node_modules package-lock.json
          npm install

          # Generate icons (macOS: iconutil; Linux: skip or use fallback)
          if [ "$(uname)" = "Darwin" ]; then
            ./scripts/generate-icons.sh
          fi

          npm run build

          # Build tauri — native on each platform
          npm run tauri build -- --no-bundle

          BIN="src-tauri/target/release/uaiengine-cockpit"
          if [ ! -x "$BIN" ]; then
            echo "missing binary: $BIN" >&2
            exit 1
          fi

          ART_DIR="/tmp/release-artifacts"
          mkdir -p "$ART_DIR"
          cp "$BIN" "$ART_DIR/uaiengine-cockpit-${{ github.ref_name }}-${ARTIFACT_NAME}.bin"
          shasum -a 256 "$ART_DIR/uaiengine-cockpit-${{ github.ref_name }}-${ARTIFACT_NAME}.bin" \
            > "$ART_DIR/uaiengine-cockpit-${{ github.ref_name }}-${ARTIFACT_NAME}.bin.sha256"

      - name: Upload artifacts to release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" /tmp/release-artifacts/* --clobber