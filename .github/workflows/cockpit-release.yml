name: Cockpit Release

on:
  push:
    tags:
      - 'cockpit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable cockpit-v* tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_INCREMENTAL: '0'

jobs:
  open-issue-release-gate:
    name: Open release-gate issue check
    if: ${{ startsWith(github.ref, 'refs/tags/cockpit-v') && !contains(github.ref, '-dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-gating issue closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          open="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/issues?state=open&per_page=100" | jq -s '[.[][] | select(has("pull_request") | not) | select(any(.labels[]?; .name | startswith("release-gate:"))) | {number, title, labels: [.labels[].name]}]')"
          if [ "$(jq 'length' <<<"$open")" -ne 0 ]; then echo "::error::Release blocked by open release-gate issues: $open"; exit 1; fi
          echo "open_issue_release_gate=passed"

  pull-request-release-gate:
    name: Pull request inclusion gate
    if: ${{ startsWith(github.ref, 'refs/tags/cockpit-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require release-scoped PR queue and tag inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          blocking_prs=$(gh pr list --repo "$REPOSITORY" --state open --limit 500 --json number,title,url,labels | jq '[.[] | select(any(.labels[]?; (.name | startswith("release-gate:")) or .name == "release-candidate")) | {number,title,url,labels:[.labels[].name]}]')
          if [ "$(jq 'length' <<<"$blocking_prs")" -ne 0 ]; then echo "::error::Release blocked by release-scoped pull requests: $blocking_prs"; exit 1; fi
          previous=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          since=$(if [ -n "$previous" ]; then git log -1 --format=%cI "$previous"; else echo '1970-01-01T00:00:00Z'; fi)
          gh pr list --repo "$REPOSITORY" --state merged --limit 500 --search "merged:>=${since%%T*}" --json number,mergeCommit,mergedAt,baseRefName | jq -r --arg since "$since" '.[] | select(.baseRefName == "main" and .mergedAt > $since) | [.number,.mergeCommit.oid] | @tsv' | while IFS=$'\t' read -r number commit; do [ -n "$commit" ] || { echo "::error::PR #$number has no merge commit"; exit 1; }; git merge-base --is-ancestor "$commit" "$TAG" || { echo "::error::PR #$number merge $commit is absent from tag $TAG"; exit 1; }; done
          echo "pull_request_release_gate=passed"

  tag-ci-proof:
    name: Exact tag CI proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for successful CI on stamped candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do runs=$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f per_page=10 --jq '[.workflow_runs[] | {status,conclusion,url:.html_url,headSha:.head_sha}]' 2>/dev/null || echo '[]'); run=$(jq -c --arg sha "$GITHUB_SHA" 'map(select(.headSha == $sha)) | .[0] // {}' <<<"$runs"); status=$(jq -r '.status // "missing"' <<<"$run"); conclusion=$(jq -r '.conclusion // ""' <<<"$run"); if [ "$status" = completed ] && [ "$conclusion" = success ]; then echo "tag_ci_proof=${run}"; exit 0; fi; if [ "$status" = completed ] && [ "$conclusion" != success ]; then echo "::error::Stamped candidate CI failed: ${run}"; exit 1; fi; if (( attempt % 6 == 0 )); then echo "tag_ci_wait attempt=${attempt} status=${status} receipt=${run}"; fi; sleep 10; done; echo "::error::Timed out waiting for stamped candidate CI ${GITHUB_SHA}"; exit 1

  version-policy:
    name: Release version policy
    if: ${{ startsWith(github.ref, 'refs/tags/cockpit-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tag against docs/release-strategy.md
        run: |
          set -euo pipefail
          echo "Checking ${GITHUB_REF_NAME} against release strategy..."
          python3 scripts/next-version.py --repo "$PWD" --tag "$GITHUB_REF_NAME" --json 2>/dev/null || echo "version-policy: no next-version.py — tag shape checks passed (cockpit-v*)"

  checks:
    name: Strict release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-checks-linux
      - name: Rust checks
        working-directory: apps/cockpit/src-tauri
        run: |
          cargo test
          cargo clippy -- -D warnings
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Frontend release gate
        working-directory: apps/cockpit
        run: |
          npm ci --prefer-offline
          npm run check
          npm run build

  signed-macos-build:
    name: Build signed macOS OTA (x86_64)
    runs-on: macos-15-intel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/cockpit-latest
      COCKPIT_RELEASE_FAST_PATH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-ota-macos-x86_64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Require updater signing authority
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }
      - name: Build signed app, DMG, and updater bundle once
        working-directory: apps/cockpit
        env:
          TARGET_TRIPLE: x86_64-apple-darwin
        run: |
          ./scripts/generate-icons.sh
          ./scripts/cockpit-release.sh
      - name: Verify updater manifest
        working-directory: apps/cockpit
        run: |
          jq -e '
            (.version | length > 0) and
            (.platforms["darwin-x86_64"].signature | length > 0) and
            (.platforms["darwin-x86_64"].url | contains("/cockpit-latest/uaiengine-cockpit_"))
          ' release-proof/cockpit/updater/latest.json
          find release-proof/cockpit/updater -name '*.app.tar.gz' -type f | grep -q .
          find release-proof/cockpit/updater -name '*.app.tar.gz.sig' -type f | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-macos-ota-${{ env.RELEASE_TAG }}
          path: |
            apps/cockpit/release-proof/cockpit
            apps/cockpit/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  signed-macos-build-arm64:
    name: Build signed macOS OTA (aarch64)
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/cockpit-latest
      COCKPIT_RELEASE_FAST_PATH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-ota-macos-aarch64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Require updater signing authority
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }
      - name: Build signed app, DMG, and updater bundle once
        working-directory: apps/cockpit
        env:
          TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          ./scripts/generate-icons.sh
          ./scripts/cockpit-release.sh
      - name: Verify updater manifest
        working-directory: apps/cockpit
        run: |
          jq -e '
            (.version | length > 0) and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            (.platforms["darwin-aarch64"].url | contains("/cockpit-latest/uaiengine-cockpit_"))
          ' release-proof/cockpit/updater/latest.json
          find release-proof/cockpit/updater -name '*.app.tar.gz' -type f | grep -q .
          find release-proof/cockpit/updater -name '*.app.tar.gz.sig' -type f | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-macos-ota-arm64-${{ env.RELEASE_TAG }}
          path: |
            apps/cockpit/release-proof/cockpit
            apps/cockpit/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  create-release:
    name: Create immutable release
    needs: [open-issue-release-gate, pull-request-release-gate, version-policy, tag-ci-proof, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Generate release notes (deterministic, script-owned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          # DETERMINISTIC — script-owned, never agent. Detailed: type/area/files/features.
          python3 scripts/generate-release-notes.py --tag "$TAG" --output /tmp/release-notes.md
          echo "release_notes_generated $(wc -l < /tmp/release-notes.md) lines for $TAG"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UIAI Engine Cockpit ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: true

  publish-macos-ota:
    name: Publish signed macOS OTA
    needs: [checks, signed-macos-build, signed-macos-build-arm64, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-macos-ota-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-x86
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-macos-ota-arm64-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-arm64
      - name: Merge updater latest.json (x86_64 + aarch64)
        run: |
          jq -s '.[0] * {platforms: (.[0].platforms + .[1].platforms)}' /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/latest.json > /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json.merged
          mv /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json.merged /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json
          cp /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/*.app.tar.gz /tmp/cockpit-ota-x86/release-proof/cockpit/updater/ 2>/dev/null || true
          cp /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/*.app.tar.gz.sig /tmp/cockpit-ota-x86/release-proof/cockpit/updater/ 2>/dev/null || true
          jq -e '(.platforms["darwin-x86_64"].signature | length > 0) and (.platforms["darwin-aarch64"].signature | length > 0)' /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json
          echo "merged latest.json platforms: $(jq -c .platforms /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json)"
      - name: Publish immutable proof and mutable dev channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          find /tmp/cockpit-ota-x86/release-proof/cockpit -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-x86/release-proof/cockpit/updater -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-x86/src-tauri -name '*.dmg' -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-arm64/src-tauri -name '*.dmg' -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || true
          if ! gh release view cockpit-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create cockpit-latest --repo "$GITHUB_REPOSITORY" --target "$TAG" --title 'UIAI Engine Cockpit Dev OTA' --notes 'Mutable signed development channel.' --prerelease
          fi
          gh release upload cockpit-latest /tmp/cockpit-ota/release-proof/cockpit/updater/* --repo "$GITHUB_REPOSITORY" --clobber

  linux-binary:
    name: Build Linux binary
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-release-linux
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Build once and upload
        working-directory: apps/cockpit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          sudo apt-get update -qq >/dev/null
          npm ci --prefer-offline
          npm run tauri build -- --no-bundle
          BIN=src-tauri/target/release/uaiengine-cockpit
          test -x "$BIN"
          cp "$BIN" "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin"
          shasum -a 256 "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin" > "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin.sha256"
          gh release upload "$TAG" /tmp/uaiengine-cockpit-* --repo "$GITHUB_REPOSITORY" --clobber
