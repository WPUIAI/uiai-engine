name: Cockpit Release

on:
  push:
    tags:
      - 'cockpit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable cockpit-v* tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  rust-check:
    name: Rust + frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo checks
        working-directory: apps/cockpit/src-tauri
        run: |
          cargo test
          cargo clippy -- -D warnings

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Frontend checks
        working-directory: apps/cockpit
        run: |
          npm ci
          npm run check
          npm run build

  create-release:
    name: Create GitHub Release
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges | head -40)
          else
            COMMITS=$(git log --oneline --no-merges | head -40)
          fi
          mkdir -p /tmp/release-artifacts
          cat > /tmp/release-notes.md <<EOF
          ## UIAI Engine Cockpit ${TAG}

          Cross-platform UIAI Engine Cockpit binary release.

          ### Assets
          - Linux x86_64 binary (no-bundle)
          - macOS x86_64 binary (no-bundle)
          - Checksums for each asset

          ### Commits since previous tag
          ```
          ${COMMITS}
          ```
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UIAI Engine Cockpit ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

  build-upload:
    name: Build and upload (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: Linux_x86_64
          - platform: macos-latest
            artifact_name: macOS_x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v6
        if: matrix.platform == 'ubuntu-latest'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json

      - uses: actions/setup-node@v6
        if: matrix.platform == 'macos-latest'
        with:
          node-version: '22'

      - name: Build no-bundle tauri binary
        working-directory: apps/cockpit
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail

          # Workaround npm bug with optional dependencies (rollup native for darwin-arm64/x64).
          # See https://github.com/npm/cli/issues/4828 — clean node_modules + reinstall.
          rm -rf node_modules package-lock.json
          npm install

          # Generate icons (macOS: iconutil; Linux: skip or use fallback)
          if [ "$(uname)" = "Darwin" ]; then
            ./scripts/generate-icons.sh
          fi

          npm run build

          # Build tauri — native on each platform
          npm run tauri build -- --no-bundle

          BIN="src-tauri/target/release/uaiengine-cockpit"
          if [ ! -x "$BIN" ]; then
            echo "missing binary: $BIN" >&2
            exit 1
          fi

          ART_DIR="/tmp/release-artifacts"
          mkdir -p "$ART_DIR"
          cp "$BIN" "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${ARTIFACT_NAME}.bin"
          shasum -a 256 "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${ARTIFACT_NAME}.bin" \
            > "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${ARTIFACT_NAME}.bin.sha256"

      - name: Upload artifacts to release
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" /tmp/release-artifacts/* --clobber

  macos-signed-ota:
    name: Signed macOS dev OTA
    needs: create-release
    runs-on: macos-15-intel
    env:
      TAG: ${{ env.RELEASE_TAG }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/cockpit-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json

      - name: Require updater signing authority
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }

      - name: Build signed app, DMG, and updater bundle
        working-directory: apps/cockpit
        env:
          TARGET_TRIPLE: x86_64-apple-darwin
        run: |
          ./scripts/generate-icons.sh
          ./scripts/cockpit-release.sh

      - name: Verify updater manifest
        working-directory: apps/cockpit
        run: |
          jq -e '
            (.version | length > 0) and
            (.platforms["darwin-x86_64"].signature | length > 0) and
            (.platforms["darwin-x86_64"].url | contains("/cockpit-latest/"))
          ' release-proof/cockpit/updater/latest.json
          find release-proof/cockpit/updater -name '*.app.tar.gz' -type f | grep -q .
          find release-proof/cockpit/updater -name '*.app.tar.gz.sig' -type f | grep -q .

      - name: Upload immutable release proof
        working-directory: apps/cockpit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-proof/cockpit -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          find release-proof/cockpit/updater -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -print0 | xargs -0 gh release upload "$TAG" --clobber

      - name: Publish mutable dev OTA channel
        working-directory: apps/cockpit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view cockpit-latest >/dev/null 2>&1; then
            gh release create cockpit-latest --target "$GITHUB_SHA" --title 'UIAI Engine Cockpit Dev OTA' --notes 'Mutable signed development channel. Install once, then Cockpit updates automatically.' --prerelease
          fi
          gh release upload cockpit-latest release-proof/cockpit/updater/* --clobber