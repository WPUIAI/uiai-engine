name: Cockpit Release

on:
  push:
    tags:
      - 'cockpit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable cockpit-v* tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_INCREMENTAL: '0'

concurrency:
  group: cockpit-release
  cancel-in-progress: false

jobs:
  open-issue-release-gate:
    name: Open release-gate issue check
    if: ${{ startsWith(inputs.tag || github.ref_name, 'cockpit-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-gating issue closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-dev* ]]; then echo 'dev tag — issue gate advisory'; exit 0; fi
          open="$(gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/issues?state=open&per_page=100" | jq -s '[.[][] | select(has("pull_request") | not) | select(any(.labels[]?; .name | startswith("release-gate:"))) | {number, title, labels: [.labels[].name]}]')"
          if [ "$(jq 'length' <<<"$open")" -ne 0 ]; then echo "::error::Release blocked by open release-gate issues: $open"; exit 1; fi
          echo "open_issue_release_gate=passed"

  pull-request-release-gate:
    name: Pull request inclusion gate
    if: ${{ startsWith(inputs.tag || github.ref_name, 'cockpit-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require release-scoped PR queue and tag inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          blocking_prs=$(gh pr list --repo "$REPOSITORY" --state open --limit 500 --json number,title,url,labels | jq '[.[] | select(any(.labels[]?; (.name | startswith("release-gate:")) or .name == "release-candidate")) | {number,title,url,labels:[.labels[].name]}]')
          if [ "$(jq 'length' <<<"$blocking_prs")" -ne 0 ]; then echo "::error::Release blocked by release-scoped pull requests: $blocking_prs"; exit 1; fi
          previous=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          since=$(if [ -n "$previous" ]; then git log -1 --format=%cI "$previous"; else echo '1970-01-01T00:00:00Z'; fi)
          gh pr list --repo "$REPOSITORY" --state merged --limit 500 --search "merged:>=${since%%T*}" --json number,mergeCommit,mergedAt,baseRefName | jq -r --arg since "$since" '.[] | select(.baseRefName == "main" and .mergedAt > $since) | [.number,.mergeCommit.oid] | @tsv' | while IFS=$'\t' read -r number commit; do [ -n "$commit" ] || { echo "::error::PR #$number has no merge commit"; exit 1; }; git merge-base --is-ancestor "$commit" "$TAG" || { echo "::error::PR #$number merge $commit is absent from tag $TAG"; exit 1; }; done
          echo "pull_request_release_gate=passed"

  tag-ci-proof:
    name: Exact tag CI proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Wait for successful CI on stamped candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 120); do runs=$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$CANDIDATE_SHA" -f per_page=10 --jq '[.workflow_runs[] | {status,conclusion,url:.html_url,headSha:.head_sha}]'); run=$(jq -c --arg sha "$CANDIDATE_SHA" 'map(select(.headSha == $sha)) | .[0] // {}' <<<"$runs"); status=$(jq -r '.status // "missing"' <<<"$run"); conclusion=$(jq -r '.conclusion // ""' <<<"$run"); if [ "$status" = completed ] && [ "$conclusion" = success ]; then echo "tag_ci_proof=${run}"; exit 0; fi; if [ "$status" = completed ] && [ "$conclusion" != success ]; then echo "::error::Stamped candidate CI failed: ${run}"; exit 1; fi; if (( attempt % 6 == 0 )); then echo "tag_ci_wait attempt=${attempt} status=${status} receipt=${run}"; fi; sleep 10; done; echo "::error::Timed out waiting for stamped candidate CI ${CANDIDATE_SHA}"; exit 1

  version-policy:
    name: Release version policy
    if: ${{ startsWith(inputs.tag || github.ref_name, 'cockpit-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag against canonical version surfaces
        run: |
          set -euo pipefail
          python3 scripts/verify-uiai-version-surfaces.py "$RELEASE_TAG"

  checks:
    name: Strict release checks
    needs: [open-issue-release-gate, pull-request-release-gate, version-policy, tag-ci-proof]
    runs-on: [self-hosted, ovh, uiai-engine]
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      candidate_version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Bind candidate version and immutable source
        id: candidate
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' apps/cockpit/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-checks-linux
      - name: Rust checks
        run: |
          bash scripts/check-cockpit-rust.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Frontend release gate
        working-directory: apps/cockpit
        run: |
          npm ci --prefer-offline
          npm run check
          npm test
          npm run build

  qualified-macos:
    name: Build and qualify exact signed macOS packages
    needs: checks
    permissions:
      contents: read
    uses: ./.github/workflows/cockpit.yml
    with:
      qualify_ota: true
      candidate_ref: ${{ needs.checks.outputs.candidate_sha }}
      candidate_version: ${{ needs.checks.outputs.candidate_version }}
      artifact_suffix: ${{ inputs.tag || github.ref_name }}
      candidate_tag: ${{ inputs.tag || github.ref_name }}
      baseline_version: '0.3.0'
      baseline_ref: 'c9b94a1dd77c052b4b6df9e07573d1237cad652f'
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  create-release:
    name: Stage immutable draft release
    needs: [checks, qualified-macos]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Generate release notes (deterministic, script-owned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          # DETERMINISTIC — script-owned, never agent. Detailed: type/area/files/features.
          python3 scripts/generate-release-notes.py --tag "$TAG" --output /tmp/release-notes.md
          echo "release_notes_generated $(wc -l < /tmp/release-notes.md) lines for $TAG"
      - name: Refuse replacement of a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh release list --limit 1000 --json tagName,isDraft | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tagName == $tag) | .isDraft')"
          case "$state" in
            true|'') ;;
            *) echo 'Published or ambiguous release is immutable' >&2; exit 2 ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UIAI Engine Cockpit ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          draft: true
          prerelease: true

  publish-macos-ota:
    name: Stage native-qualified macOS OTA
    needs: [checks, qualified-macos, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-macos-ota-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-x86
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-macos-ota-arm64-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-arm64
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.checks.outputs.candidate_sha }}
      - name: Require exact native-qualified bytes before staging
        env:
          CANDIDATE_SHA: ${{ needs.checks.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ needs.checks.outputs.candidate_version }}
        run: |
          set -euo pipefail
          python3 scripts/verify-native-ota-artifact.py /tmp/cockpit-ota-x86 darwin-x86_64 "$CANDIDATE_SHA" "$CANDIDATE_VERSION" "$GITHUB_REPOSITORY"
          python3 scripts/verify-native-ota-artifact.py /tmp/cockpit-ota-arm64 darwin-aarch64 "$CANDIDATE_SHA" "$CANDIDATE_VERSION" "$GITHUB_REPOSITORY"
          cp /tmp/cockpit-ota-x86/native-ota-receipt.json /tmp/cockpit-ota-x86/release-proof/cockpit/cockpit-native-ota-darwin-x86_64.json
          cp /tmp/cockpit-ota-arm64/native-ota-receipt.json /tmp/cockpit-ota-x86/release-proof/cockpit/cockpit-native-ota-darwin-aarch64.json
      - name: Merge updater latest.json (x86_64 + aarch64)
        run: |
          set -euo pipefail
          jq -e -s 'if length != 2 or .[0].version != .[1].version then error("OTA platform versions differ") else .[0] * {platforms: (.[0].platforms + .[1].platforms)} end' /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/latest.json > /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json.merged
          mv /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json.merged /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json
          cp /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/*.app.tar.gz /tmp/cockpit-ota-x86/release-proof/cockpit/updater/
          cp /tmp/cockpit-ota-arm64/release-proof/cockpit/updater/*.app.tar.gz.sig /tmp/cockpit-ota-x86/release-proof/cockpit/updater/
          jq -e '(.platforms["darwin-x86_64"].signature | length > 0) and (.platforms["darwin-aarch64"].signature | length > 0)' /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json
          echo "merged latest.json platforms: $(jq -c .platforms /tmp/cockpit-ota-x86/release-proof/cockpit/updater/latest.json)"
      - name: Stage immutable proof (channel unchanged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          find /tmp/cockpit-ota-x86/release-proof/cockpit -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-x86/release-proof/cockpit/updater -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-x86/src-tauri -name '*.dmg' -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          find /tmp/cockpit-ota-arm64/src-tauri -name '*.dmg' -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-ota-merged-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-x86/release-proof/cockpit/updater
          if-no-files-found: error
          retention-days: 1

  linux-binary:
    name: Build Linux binary
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri
          shared-key: cockpit-release-linux
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Build once and upload
        working-directory: apps/cockpit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          sudo apt-get update -qq >/dev/null
          npm ci --prefer-offline
          npm run tauri build -- --no-bundle
          BIN=src-tauri/target/release/uaiengine-cockpit
          test -x "$BIN"
          cp "$BIN" "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin"
          shasum -a 256 "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin" > "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin.sha256"
          gh release upload "$TAG" "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin" "/tmp/uaiengine-cockpit-${TAG}-Linux_x86_64.bin.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  promote-release:
    name: Publish verified assets and advance OTA feed last
    needs: [create-release, publish-macos-ota, linux-binary]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-ota-merged-${{ env.RELEASE_TAG }}
          path: /tmp/cockpit-ota-verified
      - name: Promote immutable release and mutable channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          updater=/tmp/cockpit-ota-verified
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$state" == true ]] || { echo 'Only a draft may be promoted' >&2; exit 2; }
          actual="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' --dir "$actual"
          for file in "$updater"/*.app.tar.gz "$updater"/*.app.tar.gz.sig; do
            cmp -- "$file" "$actual/$(basename "$file")"
          done
          case "$TAG" in
            *-dev*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false ;;
          esac
          channel="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft | jq -r '.[] | select(.tagName == "cockpit-latest") | .isDraft')"
          case "$channel" in
            false) ;;
            '') gh release create cockpit-latest --repo "$GITHUB_REPOSITORY" --target "$TAG" --title 'UIAI Engine Cockpit OTA' --notes 'Mutable signed Cockpit update channel.' --prerelease --latest=false ;;
            *) echo 'Unexpected draft or ambiguous OTA channel' >&2; exit 2 ;;
          esac
          # The feed must remain unchanged if any bundle/signature upload fails.
          gh release upload cockpit-latest "$updater"/*.app.tar.gz "$updater"/*.app.tar.gz.sig --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload cockpit-latest "$updater/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
