name: Cockpit Release

on:
  push:
    tags:
      - 'cockpit-v*'

permissions:
  contents: write

jobs:
  rust-check:
    name: Rust + frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo checks
        working-directory: apps/cockpit/src-tauri
        run: |
          cargo test
          cargo clippy -- -D warnings

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json
      - name: Frontend checks
        working-directory: apps/cockpit
        run: |
          npm ci
          npm run check
          npm run build

  create-release:
    name: Create GitHub Release
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..${TAG}" --no-merges | head -40)
          else
            COMMITS=$(git log --oneline --no-merges | head -40)
          fi
          mkdir -p /tmp/release-artifacts
          cat > /tmp/release-notes.md <<EOF
          ## UIAI Engine ${TAG} — Cockpit Release

          UIAI Engine is a cross-product operator cockpit for agent continuity, scope authority, evidence, recovery, trajectory, and tool governance.

          ### What this release proves
          - Frontend/build pipeline passed for this tag.
          - `cargo test` and `cargo clippy -D warnings` passed.
          - Tauri app was built for each release platform.

          ### Commits since previous tag
          ```
          ${COMMITS}
          ```

          ### Assets
          - `uaiengine-cockpit` binaries per platform (no-bundle tauri build output)
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UIAI Engine Cockpit ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

  build-upload:
    name: Build and upload platform binaries
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf 2>&1 | tail -5

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cockpit/package-lock.json

      - name: Build no-bundle tauri binary
        working-directory: apps/cockpit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm ci
          ./scripts/generate-icons.sh
          npm run build
          npm run tauri build -- --no-bundle

          BIN="src-tauri/target/release/uaiengine-cockpit"
          if [ ! -x "$BIN" ]; then
            echo "missing binary: $BIN" >&2
            exit 1
          fi

          PLATFORM_DIR="${{ runner.os }}"
          RELEASE_TAG="${{ github.ref_name }}"
          ART_DIR="/tmp/release-artifacts"
          mkdir -p "$ART_DIR"
          cp "$BIN" "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${PLATFORM_DIR}.bin"
          shasum -a 256 "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${PLATFORM_DIR}.bin" > "$ART_DIR/uaiengine-cockpit-${RELEASE_TAG}-${PLATFORM_DIR}.bin.sha256"

      - name: Upload artifacts to release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" /tmp/release-artifacts/* --clobber