name: Create Semantic Cockpit Release

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Initial major/minor lane when no prior tag exists'
        required: true
        default: '0.1'
      bump:
        description: 'Semantic version bump; auto reads conventional commits'
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [dev, stable]
        default: dev
      push:
        description: 'Create immutable tag and dispatch signed release'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  create-tag:
    name: Compute semantic tag and start signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git auth
        run: git config user.name "$GIT_AUTHOR_NAME" && git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Create next dev tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            apps/cockpit/scripts/create-cockpit-dev-release-tag.sh --base "${{ inputs.base }}" --bump "${{ inputs.bump }}" --channel "${{ inputs.channel }}" --push
          else
            apps/cockpit/scripts/create-cockpit-dev-release-tag.sh --base "${{ inputs.base }}" --bump "${{ inputs.bump }}" --channel "${{ inputs.channel }}" --dry-run
          fi

      - name: Dispatch signed dev OTA release
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git tag --points-at HEAD --list 'cockpit-v*' --sort=-v:refname | head -1)
          test -n "$TAG" || { echo 'new Cockpit tag not found at HEAD' >&2; exit 1; }
          gh workflow run cockpit-release.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"
          echo "dispatched signed OTA release for $TAG"
