[package]
name = "uaiengine-cockpit"
version = "0.1.0-dev"
edition = "2021"
description = "UIAI Engine Cockpit — Tauri desktop shell"
license = "Commercial"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
mdns-sd = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
